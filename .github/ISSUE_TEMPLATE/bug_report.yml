name: "🐞 Bug Report"
description: Report a reproducible bug
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: Short summary
      placeholder: e.g. "Navbar breaks on mobile"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "How can we see the bug?"
      placeholder: "1. Go to...\n2. Click on..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
