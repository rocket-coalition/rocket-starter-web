baseURL: "https://rocket-starter-web.com/"
languageCode: "en-us"
title: "Rocket Starter Kit"
enableRobotsTXT: true
enableGitInfo: true
buildDrafts: true   # Change to false in production if you want to hide drafts

pagination:
  pagerSize: 10

params:
  description: "The Genesis starter for all Rocket-powered web sites."
  author: "Raiford Brookshire"
  repo: "https://github.com/rocket-coalition/rocket-starter-web"
  # UI theming hooks (applied to the root data-* attributes, not Hugo themes)
  data-theme: "blueprint"
  data-density: "normal"


markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: "tags"
  category: "categories"
  rocket-tag: "rocket-tags"
  rocket-category: "rocket-categories"

outputs:
  home: ["HTML", "RSS", "JSON"]

# Uncomment and customize if using permalinks for content sections
#permalinks:
#  features: "/features/:slug/"

menus:
  main:
    - name: "Home"
      url: "/"
      weight: 10
    - name: "Showcase / Colors"
      url: "/showcase/colors/"
      weight: 20
    - name: "Showcase / Color Theory"
      url: "/showcase/color-theory/"
      weight: 30
    - name: "Showcase / Themes"
      url: "/showcase/themes/"
      weight: 35
    - name: "Showcase / Theme Test"
      url: "/showcase/theme-test/"
      weight: 40
    - name: "Showcase / Theme Primitives"
      url: "/showcase/theme-primitive/"
      weight: 45
    - name: "Showcase / Theme Diagnostics"
      url: "/showcase/test2/"
      weight: 50
