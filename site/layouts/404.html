<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>404 — Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <div style="max-width: 400px; margin: 8rem auto; text-align: center;">
      <h1 style="font-size: 4rem; margin-bottom: 1rem;">404</h1>
      <h2 style="margin-bottom: 0.5rem;">Page Not Found</h2>
      <p style="margin-bottom: 2rem;">
        Sorry, the page you’re looking for doesn’t exist.<br>
        Return to the <a href="/">home page</a>.

      <button onclick="window.history.back()" style="padding: 0.5em 1.5em; font-size: 1rem;">Go Back</button>
    </div>
  </body>
</html>
