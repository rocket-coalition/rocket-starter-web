<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>

    {{ $css := resources.Get "css/output.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}images/og-image.png">
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }}">
    <meta name="twitter:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="twitter:image" content="{{ .Site.BaseURL }}images/og-image.png">

  </head>




  <body data-theme="rocket" data-density="normal">

    <!-- Semantic wrapper for global site context -->
    <div class="layout-site-frame layout-landing-page">

      <header class="layout-header" role="banner">
        <div class="flex items-center justify-center py-4">
          <h1 class="text-xl font-semibold">{{ .Site.Title }}</h1>
        </div>
      </header>

      <main id="content" class="layout-main" role="main">
        {{ block "main" . }}{{ end }}
      </main>

      <footer class="layout-footer" role="contentinfo">
        <div class="text-center py-4 text-sm">
          © {{ now.Format "2006" }} {{ .Site.Title }}. All rights reserved.
        </div>
      </footer>
    </div>

  </body>
</html>
